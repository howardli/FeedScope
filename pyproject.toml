[project]
name = "feedscope"
dynamic = ["version"]   # 唯一出处 src/feedscope/__init__.py 的 __version__，防双处漂移
description = "FeedScope (观流): a terminal feed reader — Zhihu / X / Reddit / HN / V2EX / RSS / Telegram, all in one terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "howardli" }]
keywords = ["tui", "textual", "cli", "reader", "zhihu", "twitter", "rss", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=1.0",
    "rich>=13",
    "playwright>=1.45",
    "platformdirs>=4.0",
    "html2text>=2024.2.26",
    "httpx>=0.27",
    "feedparser>=6",
]

[project.urls]
Homepage = "https://github.com/howardli/FeedScope"
Repository = "https://github.com/howardli/FeedScope"
Issues = "https://github.com/howardli/FeedScope/issues"
Changelog = "https://github.com/howardli/FeedScope/blob/main/CHANGELOG.md"

[project.scripts]
feedscope = "feedscope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedscope"]

[tool.hatch.build.targets.sdist]
# README 在 PyPI 上不渲染相对路径图片：截图 / GIF 留在 repo 即可，不进下载负担
exclude = ["docs/*.png", "docs/*.gif"]

[tool.hatch.version]
path = "src/feedscope/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
ignore = [
  # 抓取/清理路径大量「尽力而为」的宽捕获（关弹窗、关页签、吞渲染抖动），是有意为之
  "BLE001",
  "S110",
]

[tool.ruff.lint.per-file-ignores]
# 测试与截图脚本的长行是数据不是代码：fixture HTML / demo 文案 / 断言原文，
# 折行只会伤可读性；产品代码（src/）行宽照常受限
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
# src 全量零错误（2026-11 起随 ruff/pytest 进 CI）；tests/scripts 的 pytest
# 动态风格（monkeypatch/fixture）不在检查范围——类型契约由 src 侧保证
files = ["src/feedscope"]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["feedscope"]
branch = true

[tool.coverage.report]
# 门槛起点取当前实测略下方：防倒退而不是刷数字；新增模块默认应抬高它
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=2.4.1",
]
