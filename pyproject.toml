[project]
name = "feedscope"
dynamic = ["version"]   # 唯一出处 src/feedscope/__init__.py 的 __version__，防双处漂移
description = "FeedScope (观流): a terminal feed reader — Zhihu / X / Reddit / HN / V2EX / RSS / Telegram, all in one terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "howardli" }]
keywords = ["tui", "textual", "cli", "reader", "zhihu", "twitter", "rss", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.0",  # theme.py 依赖 Textual 8 的 Theme 数据类语义，1.x-7.x 装出即启动失败
    "rich>=13",
    "playwright>=1.45",
    "platformdirs>=4.0",
    "html2text>=2024.2.26",
    "httpx>=0.27",
    "feedparser>=6",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/howardli/FeedScope"
Repository = "https://github.com/howardli/FeedScope"
Issues = "https://github.com/howardli/FeedScope/issues"
Changelog = "https://github.com/howardli/FeedScope/blob/main/CHANGELOG.md"

[project.scripts]
feedscope = "feedscope.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 SPDX license 表达式需要
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedscope"]

[tool.hatch.build.targets.sdist]
# README 的截图 / GIF 走 GitHub raw 绝对 URL（PyPI 页面照样渲染），
# 图片本体留在 repo 即可，不进下载负担
exclude = ["docs/*.png", "docs/*.gif"]

[tool.hatch.version]
path = "src/feedscope/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 扩面（2026-11）：B 抓常见坑、UP 现代写法、I 导入排序、SIM 冗余写法、RUF 杂项
# （含 RUF100 未用的 noqa）。BLE001/S110 见 ignore 注释
select = ["E4", "E7", "E9", "F", "E501", "B", "UP", "I", "SIM", "RUF"]
ignore = [
  # 抓取/清理路径大量「尽力而为」的宽捕获（关弹窗、关页签、吞渲染抖动），是有意为之
  "BLE001",
  "S110",
  # 中文项目：注释/文案里的全角标点（，：；）是本意不是「歧义字符」
  "RUF001",
  "RUF002",
  "RUF003",
  # Source.feeds/feed_labels 的类体可变默认是有意设计：类体写内置默认流、
  # __init__ 按配置合成实例视图（故不作 ClassVar，见 core/source.py 的说明）
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# 测试与截图脚本的长行是数据不是代码：fixture HTML / demo 文案 / 断言原文，
# 折行只会伤可读性；产品代码（src/）行宽照常受限
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
# strict 全量（2026-11 起）：src 零 type: ignore、零错误；tests/scripts 的
# pytest 动态风格（monkeypatch/fixture）不在检查范围——类型契约由 src 侧保证
files = ["src/feedscope"]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["feedscope"]
branch = true

[tool.coverage.report]
# 门槛取当前实测略下方：防倒退而不是刷数字；新增模块默认应抬高它
# （2026-11 实测 ~92%——browser 启动路径有了假 playwright 测试后从 60% 升到 94%）
fail_under = 88
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=2.4.1",
]
